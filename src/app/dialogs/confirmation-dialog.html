<h1 mat-dialog-title>{{data.message}}</h1>
<mat-dialog-content>
	<p>
		This is a dialog
	</p>
</mat-dialog-content>
<div>
	<mat-dialog-actions>
		<button mat-button color="primary" (click)="onCancelClick()">{{data.buttonText.cancel}}</button>
		<button mat-button [mat-dialog-close]="
		'confirmed'" cdkFocusInitial>{{data.buttonText.ok}}</button>
	</mat-dialog-actions>
</div>
